[project]
name = "crypto-bot"
version = "0.1.0"
description = "Multi-agent trading system, Bybit USDT Perpetual"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "websockets>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
crypto-bot = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids calls in default values, but that is exactly how Typer
# declares command options. Silenced only in the CLI so the rule keeps
# catching real mutable defaults in the rest of the code.
"src/cli.py" = ["B008"]

# Migration bodies are generated by Alembic from its template and rewritten
# on every generation. Style rules here produce only noise.
# migrations/env.py is not covered by this: it is ours and fully linted.
"migrations/versions/*" = ["E501", "I001", "UP035", "UP006", "UP007"]
